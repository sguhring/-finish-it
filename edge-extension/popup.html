<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Finish IT</title>
  <style>
    /* Same brand tokens as the on-page overlay (content.js) and the app
       (templates/index.html, dark set): chalk on ink, Space Grotesk, and
       green only on the dart that finishes a route. */
    @font-face {
      font-family: 'Space Grotesk'; font-weight: 300 700; font-display: swap;
      src: url(fonts/SpaceGrotesk-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: 'Space Grotesk'; font-weight: 300 700; font-display: swap;
      src: url(fonts/SpaceGrotesk-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }

    :root {
      --screen:      #0B1016;
      --card:        #141B24;
      --tile:        rgba(244, 241, 234, .07);
      --ink:         #F4F1EA;
      --ink-60:      rgba(244, 241, 234, .62);
      --ink-40:      rgba(244, 241, 234, .40);
      --line:        rgba(244, 241, 234, .14);
      --btn:         #F4F1EA;
      --btn-ink:     #0F1720;
      --finish:      #19D17F;   /* fills only: the dart that finishes */
      --finish-ink:  #06281A;   /* text on a --finish fill */
      --finish-text: #3DDC97;   /* green text on the dark surface, AA */
      --live:        #FF5D52;   /* source chip only */
      --ocr:         #F5B544;
      --bad:         #FF8A7A;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      width: 340px; margin: 0; padding: 12px;
      font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 13px; line-height: 1.35;
      color: var(--ink); background: var(--screen);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    [hidden] { display: none !important; }

    header { display: flex; align-items: center; gap: 8px; padding: 2px 4px 12px; }
    h1 {
      flex: 1; margin: 0;
      font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
      color: var(--ink-60);
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 22px; padding: 0 10px 0 8px;
      border: 1px solid var(--line); border-radius: 999px;
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      color: var(--ink-60);
    }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-40); }
    .chip[data-state="live"]         { color: var(--ink); }
    .chip[data-state="live"] .dot    { background: var(--live); }
    .chip[data-state="ocr"]          { color: var(--ocr); border-color: rgba(245, 181, 68, .4); }
    .chip[data-state="ocr"] .dot     { background: var(--ocr); }
    .chip[data-state="offline"] .dot { background: none; border: 1.5px solid var(--ink-60); }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 24px; padding: 16px;
    }
    .card + .card { margin-top: 10px; }

    /* -- readout: the same hierarchy as the overlay -- */
    .readout { text-align: center; transition: opacity .2s ease; }
    .readout.offline { opacity: .38; }
    .score {
      height: 72px;
      font-size: 72px; font-weight: 700; line-height: 1; letter-spacing: -.04em;
    }
    .score.dead { color: var(--ink-60); font-weight: 500; }
    .score.wait { color: var(--ink-40); font-weight: 500; }
    .msg {
      display: inline-flex; align-items: center;
      height: 26px; margin-top: 8px; padding: 0 13px;
      border-radius: 999px;
      font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
      color: var(--ink-60);
    }
    .msg.dead { border: 1px solid var(--line); }
    .msg:empty, #ways:empty { display: none; }

    #ways { margin-top: 12px; }
    .way { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .d { display: flex; align-items: center; justify-content: center; }
    .way.best .d {
      height: 50px;
      background: var(--tile); border: 1px solid var(--line); border-radius: 14px;
      font-size: 21px; font-weight: 700; letter-spacing: -.01em;
    }
    .way.best .d.fin { background: var(--finish); border-color: var(--finish); color: var(--finish-ink); }
    .way.best .d.na  { background: none; border-style: dashed; color: var(--ink-40); }
    .way.alt { margin-top: 2px; }
    .way.best + .way.alt { margin-top: 8px; }
    .way.alt .d { height: 22px; font-size: 12.5px; font-weight: 600; color: var(--ink-60); }
    .way.alt .d.fin { color: var(--finish-text); font-weight: 700; }
    .way.alt .d.na  { color: var(--ink-40); }

    /* -- status rows -- */
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .row + .row { margin-top: 6px; }
    .k { flex: none; color: var(--ink-60); font-weight: 500; }
    .v { min-width: 0; text-align: right; font-weight: 600; overflow-wrap: anywhere; }
    .v.warn { color: var(--ocr); }
    .v.bad  { color: var(--bad); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
    .sel {
      margin-top: 6px;
      font-size: 11px; line-height: 1.4; color: var(--ink-40);
      word-break: break-all;
    }
    .sel:empty { display: none; }

    .btns { display: flex; gap: 8px; margin-top: 12px; }
    .btns button {
      height: 48px; padding: 0 16px;
      border: 1px solid var(--line); border-radius: 14px;
      background: none; color: var(--ink);
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    /* The primary button is ink, not green: green is the finish. */
    .btns button.go { flex: 1; background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
    .btns button:active { transform: scale(.985); opacity: .9; }
    .btns button:disabled { opacity: .35; cursor: default; transform: none; }

    p.hint { margin: 10px 4px 0; font-size: 11.5px; line-height: 1.45; color: var(--ink-60); }
    p.hint:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Finish IT</h1>
    <span class="chip" id="src" data-state="idle"><i class="dot"></i><span id="srcText">…</span></span>
  </header>

  <section class="card readout" id="readout">
    <div class="score wait" id="score" aria-live="polite" aria-atomic="true">—</div>
    <div class="msg" id="msg"></div>
    <div id="ways"></div>
  </section>

  <section class="card">
    <div class="row"><span class="k">App</span><span class="v" id="app">…</span></div>
    <div class="row"><span class="k">Player</span><span class="v" id="field">…</span></div>
    <hr/>
    <div class="row"><span class="k">Site</span><span class="v" id="site">…</span></div>
    <div class="row"><span class="k">Score element</span><span class="v" id="pickState">…</span></div>
    <div class="sel" id="selectors"></div>
    <div class="btns">
      <button class="go" id="pick">Select score element</button>
      <button id="forget" hidden>Reset</button>
    </div>
  </section>

  <p class="hint" id="hint"></p>

  <script src="popup.js"></script>
</body>
</html>
