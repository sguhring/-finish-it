  <rect width="1024" height="1024" fill="#0F1720"/>
  <rect x="232" y="232" width="560" height="148" rx="74" fill="#F4F1EA"/>
  <rect x="232" y="438" width="354" height="148" rx="74" fill="#F4F1EA"/>
  <circle cx="306" cy="718" r="74" fill="#19D17F"/>
</svg>
